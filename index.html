<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piece of Tech</title>
<meta name="description" content="Piece of Tech LLC builds apps.">
<style>
  :root { --bg:#fbfaf7; --fg:#1d1d1b; --muted:#5f5e5a; --line:#e4e1d9; --accent:#2f6f4e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161715; --fg:#f1efe9; --muted:#a3a198; --line:#2b2c28; --accent:#7fc29c; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width:36rem; margin:0 auto; padding:4rem 1rem 3rem; }
  h1 { font-size:2rem; line-height:1.2; margin:0 0 .5rem; }
  p.lead { color:var(--muted); margin:0 0 2.5rem; }
  h2 { font-size:.8rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 .75rem; }
  ul { list-style:none; margin:0; padding:0; border-top:1px solid var(--line); }
  li { padding:1rem 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
  a { color:var(--accent); }
  .name { font-weight:600; }
  footer { margin-top:3rem; color:var(--muted); font-size:.85rem; }
</style>
</head>
<body>
<main>
  <h1>Piece of Tech</h1>
  <p class="lead">Piece of Tech LLC builds apps.</p>
  <h2>Apps</h2>
  <ul>
    <li><span class="name">Dinner Party</span> <a href="/dinner-party/">Privacy policy</a></li>
  </ul>
  <footer>Contact: <a href="mailto:hello@pieceoftech.app">hello@pieceoftech.app</a><br>&copy; 2026 Piece of Tech LLC</footer>
</main>
</body>
</html>
